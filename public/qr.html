<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Código QR - Race Club Hub</title>
  <script src="/lib/qrious.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e40af, #7c3aed);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 2rem 1.5rem;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    .logo { font-size: 2rem; margin-bottom: 0.25rem; }
    .title { font-size: 1rem; color: #6b7280; margin-bottom: 1.5rem; }
    .dorsal { font-size: 3.5rem; font-weight: 800; color: #2563eb; }
    .nombre { font-size: 1.4rem; font-weight: 600; margin: 0.5rem 0; color: #1e293b; }
    .categoria {
      color: #4b5563;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
      background: #f1f5f9;
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
    }
    #qr-container {
      margin: 1rem 0;
      padding: 1rem;
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 12px;
      display: inline-block;
    }
    #qr-container canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    .instructions {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 1rem;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: #166534;
    }
    .btn-download {
      display: inline-block;
      margin-top: 1rem;
      background: #2563eb;
      color: white;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      border: none;
      font-size: 0.9rem;
    }
    .btn-download:hover { background: #1d4ed8; }
    .info-table {
      width: 100%;
      margin: 1rem 0;
      border-collapse: collapse;
    }
    .info-table td {
      padding: 0.4rem 0.5rem;
      text-align: left;
      font-size: 0.9rem;
      border-bottom: 1px solid #f1f5f9;
    }
    .info-table td:first-child {
      color: #64748b;
      font-weight: 500;
      width: 40%;
    }
    .info-table td:last-child {
      font-weight: 600;
      color: #1e293b;
    }
    .error { color: #dc2626; margin-top: 1rem; }
    @media print {
      body { background: white; padding: 0; }
      .card { box-shadow: none; max-width: 100%; }
      .btn-download { display: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏊‍♂️🚴‍♂️🏃‍♂️</div>
    <div class="title">Race Club Hub - Triatlón</div>
    <div id="content">
      <p style="color:#64748b;">Cargando tu código QR...</p>
    </div>
  </div>

  <script>
    async function loadQR() {
      const params = new URLSearchParams(window.location.search);
      const dorsal = params.get('dorsal');
      const content = document.getElementById('content');

      if (!dorsal) {
        content.innerHTML = '<p class="error">No se proporcionó un número de dorsal.</p>';
        return;
      }

      try {
        const res = await fetch(`/api/participants/${dorsal}`);
        if (!res.ok) throw new Error('No encontrado');
        const p = await res.json();

        content.innerHTML = `
          <div class="dorsal">#${p.dorsal}</div>
          <div class="nombre">${p.nombre}</div>
          <span class="categoria">${p.categoria}</span>

          <div id="qr-container">
            <canvas id="qr-canvas"></canvas>
          </div>

          <table class="info-table">
            <tr><td>👤 Nombre</td><td>${p.nombre}</td></tr>
            <tr><td>🔢 Dorsal</td><td>#${p.dorsal}</td></tr>
            <tr><td>🏷️ Categoría</td><td>${p.categoria}</td></tr>
          </table>

          <div class="instructions">
            <strong>📱 Presentá este QR el día de la carrera</strong> para hacer tu check-in de forma rápida. 
            Podés guardar una captura de pantalla o descargarlo.
          </div>

          <button class="btn-download" onclick="downloadQR()">📥 Descargar QR</button>
        `;

        // Generate QR immediately and visibly
        const canvas = document.getElementById('qr-canvas');
        const qrData = JSON.stringify({ dorsal: p.dorsal, nombre: p.nombre });
        new QRious({
          element: canvas,
          value: qrData,
          size: 280,
          level: 'M'
        });

        document.title = `QR #${p.dorsal} - ${p.nombre} - Race Club Hub`;
      } catch (err) {
        content.innerHTML = `<p class="error">Participante no encontrado (dorsal: ${dorsal})</p>`;
      }
    }

    function downloadQR() {
      const canvas = document.getElementById('qr-canvas');
      if (!canvas) return;
      const link = document.createElement('a');
      link.download = `qr-dorsal-${new URLSearchParams(window.location.search).get('dorsal')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    loadQR();
  </script>
</body>
</html>
